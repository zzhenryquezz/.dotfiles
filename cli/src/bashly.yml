name: dot
help: Run scripts on dot files
version: 0.1.0

commands:
    - name: waybar
      catch_all: true

    - name: tmux
      commands:
          - name: project
            help: open project

          - name: create
            help: create a tmux session
            args:
                - name: dir
                  help: dir to open the session

    - name: hypr
      commands:
          - name: list
            help: list hyprland modifiers

          - name: activate
            help: activate hyprland modifier
            args:
                - name: modifier
                  required: true
                  repeatable: true
                  unique: true
                  help: modifier or list of modifiers

          - name: deactivate
            help: deactivate hyprland modifier
            args:
                - name: modifier
                  required: true
                  repeatable: true
                  unique: true
                  help: modifier or list of modifiers

          - name: toggle
            help: toggle hyprland modifier
            args:
                - name: modifier
                  required: true
                  repeatable: true
                  unique: true
                  help: modifier or list of modifiers
